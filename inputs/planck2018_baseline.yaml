# Planck 2018 baseline LCDM: TT,TE,EE + lowl + lowE + lensing
# Target: Planck 2018 VI (arXiv:1807.06209), Table 2, column "TT,TE,EE+lowE+lensing".
#
# Choices made to match the paper setup:
#  - one massive neutrino, m = 0.06 eV, N_eff = 3.046 (N_ur = 2.0328 for CLASS)
#  - BBN-consistent helium, halofit non-linear lensing correction (paper baseline)
#  - tau with a *flat* prior: lowE constrains it, so no Gaussian tau prior
#  - sample the acoustic angle (100*theta_s) instead of H0 -> far better mixing
#  - plik nuisance params + their priors are added automatically by cobaya

theory:
  classy:
    extra_args:
      N_ncdm: 1
      m_ncdm: 0.06
      deg_ncdm: 1
      N_ur: 2.0328
      T_cmb: 2.7255
      YHe: BBN
      non_linear: halofit

likelihood:
  planck_2018_lowl.TT_clik: null
  planck_2018_lowl.EE_clik: null
  planck_2018_highl_plik.TTTEEE: null
  planck_2018_lensing.clik: null

params:
  # --- sampled cosmological parameters (paper priors) ---
  logA:
    prior: {min: 1.61, max: 3.91}
    ref: {dist: norm, loc: 3.044, scale: 0.01}
    proposal: 0.005
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  n_s:
    prior: {min: 0.8, max: 1.2}
    ref: {dist: norm, loc: 0.965, scale: 0.004}
    proposal: 0.002
    latex: n_\mathrm{s}
  theta_s_100:
    prior: {min: 0.5, max: 10}
    ref: {dist: norm, loc: 1.0416, scale: 0.0004}
    proposal: 0.0002
    latex: 100\theta_\mathrm{s}
    renames: theta
  omega_b:
    prior: {min: 0.005, max: 0.1}
    ref: {dist: norm, loc: 0.0224, scale: 0.0001}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior: {min: 0.001, max: 0.99}
    ref: {dist: norm, loc: 0.12, scale: 0.001}
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
  tau_reio:
    prior: {min: 0.01, max: 0.8}
    ref: {dist: norm, loc: 0.055, scale: 0.006}
    proposal: 0.003
    latex: \tau_\mathrm{reio}

  # --- derived parameters (for comparison with Table 2) ---
  H0: {latex: H_0}
  Omega_m: {latex: '\Omega_\mathrm{m}'}
  Omega_Lambda: {latex: \Omega_\Lambda}
  omegamh2:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  sigma8: {latex: \sigma_8}
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8
  z_reio: {latex: 'z_\mathrm{re}'}
  YHe: {latex: 'Y_\mathrm{P}'}
  age: {latex: '{\rm Age}/\mathrm{Gyr}'}
  rs_drag: {latex: 'r_\mathrm{drag}'}

sampler:
  mcmc:
    covmat: auto            # picks a Planck covmat from the packages dir if available
    drag: true              # fast-slow dragging over the ~20 plik nuisance params
    oversample_power: 0.4
    proposal_scale: 1.9
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    learn_proposal: true
    max_tries: 10000

# Relative to the directory you launch from (Code/); override with -o
output: chains/planck2018_baseline/chain
