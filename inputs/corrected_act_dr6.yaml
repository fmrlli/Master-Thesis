# ==============================================================================
# Corrected ACT DR6 Baseline LCDM: TT,TE,EE (CMB-only) + tau prior
# ==============================================================================
# Primary Target:
#   ACT Collaboration, Louis et al. (2025),
#   "The Atacama Cosmology Telescope: DR6 Power Spectra, Likelihoods and LCDM Parameters",
#   JCAP (arXiv:2503.14452), Table 5, column "ACT" (TT,TE,EE + SRoll2 tau prior);
#   and Calabrese et al. (2025, arXiv:2503.14454).
#
# Official Repository Configs Where These Values Come From:
#   1. Likelihood & Gaussian priors (tau, A_act):
#      candl_data/candl_data/ACT_DR6_CMB_only_v0/ACT_DR6_CMB_only.yaml (L21-L36)
#   2. Polarization efficiency prior (P_act):
#      spt_candl_data/cobaya/SPT3G_D1_KK/configs/likelihoods/cmb/spalitetteete_nosroll2.yaml (L38-L47)
#   3. Base LCDM parameter definitions & priors:
#      Cobaya preset database: cobaya/cosmo_input/input_database.py
# ==============================================================================

theory:
  classy:
    extra_args:
      # --- Neutrino sector ---
      # Louis et al. (2025, arXiv:2503.14452, Section 5.1) & Calabrese et al. (2025, arXiv:2503.14454):
      #   1 massive neutrino with m_nu = 0.06 eV and N_eff = 3.044.
      #   In CLASS (explanatory.ini L351-L372), N_eff = 3.044 with 1 massive neutrino
      #   (T_ncdm = 0.71611, delta_N_eff = 1.0132) requires N_ur = 3.044 - 1.0132 = 2.0308
      #   (also used in Cobaya_lecture.pdf / tests/cobaya_test.py L26).
      N_ncdm: 1
      m_ncdm: 0.06
      deg_ncdm: 1
      N_ur: 2.0308

      # --- Photon temperature & BBN Helium ---
      # CLASS explanatory.ini L217 & L340:
      T_cmb: 2.7255
      YHe: BBN

      # --- Non-linear matter power spectrum ---
      # Louis et al. (2025, arXiv:2503.14452) & CLASS explanatory.ini L885:
      #   HMcode-2020 by Mead et al. (2021, arXiv:2009.01858)
      #   (also used in Cobaya_lecture.pdf / tests/cobaya_test.py L32-L33).
      non_linear: hmcode
      hmcode_version: '2020'

likelihood:
  # Official candl Cobaya interface for ACT DR6 CMB-only (foreground-marginalized):
  #   See candl_data/candl_data/ACT_DR6_CMB_only_v0/ACT_DR6_CMB_only.yaml
  #   `clear_internal_priors: true` clears candl's internal priors so that Cobaya
  #   manages the priors on `tau_reio` and `A_act` explicitly in the `params` block below.
  act_dr6_ttteee:
    external: !!python/name:candl.interface.CandlCobayaLikelihood ''
    data_set_file: !!python/name:candl_data.ACT_DR6_TTTEEE ''
    clear_internal_priors: true
    feedback: true

params:
  # ============================================================================
  # 6 Base LCDM Parameters
  #   - Flat priors on (logA, n_s, theta_s_100, omega_b, omega_cdm):
  #     Cobaya `input_database.py` (L27, L35, L279, L318, L325)
  #   - `ref` centers: Cobaya `input_database.py` / Planck 2018 Table 2 (p. 15)
  #   - `renames`: Maps CLASS names to CAMB names (`theta_MC_100`, `ombh2`, `omch2`, `tau`)
  #     in `spt_candl_data/cobaya/SPT3G_D1_TnE/input_ttteee.covmat`
  # ============================================================================
  logA:
    prior: {min: 1.61, max: 3.91}               # Cobaya input_database.py L27
    ref: {dist: norm, loc: 3.044, scale: 0.014} # Planck 2018 VI Table 2 (p. 15)
    proposal: 0.005
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}

  n_s:
    prior: {min: 0.8, max: 1.2}                 # Cobaya input_database.py L35
    ref: {dist: norm, loc: 0.9649, scale: 0.0042} # Planck 2018 VI Table 2 (p. 15)
    proposal: 0.002
    latex: n_\mathrm{s}

  theta_s_100:
    prior: {min: 0.5, max: 10}                  # Cobaya input_database.py L279
    ref: {dist: norm, loc: 1.0416, scale: 0.0004} # Cobaya input_database.py L280
    proposal: 0.0002
    latex: 100\theta_\mathrm{s}
    renames: [theta, theta_MC_100]

  omega_b:
    prior: {min: 0.005, max: 0.1}               # Cobaya input_database.py L318
    ref: {dist: norm, loc: 0.02237, scale: 0.00015} # Planck 2018 VI Table 2 (p. 15)
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
    renames: [ombh2, omegabh2]

  omega_cdm:
    prior: {min: 0.001, max: 0.99}              # Cobaya input_database.py L325
    ref: {dist: norm, loc: 0.1200, scale: 0.0012} # Planck 2018 VI Table 2 (p. 15)
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
    renames: [omch2, omegach2]

  tau_reio:
    # Exact ACT DR6 Gaussian prior on tau: N(0.0566, 0.0058) from Planck SRoll2 low-ell EE
    # Source:
    #   - candl_data/candl_data/ACT_DR6_CMB_only_v0/ACT_DR6_CMB_only.yaml L30-L33
    #   - Louis et al. (2025, arXiv:2503.14452, Section 5.1)
    prior: {dist: norm, loc: 0.0566, scale: 0.0058}
    ref: {dist: norm, loc: 0.0566, scale: 0.0058}
    proposal: 0.003
    latex: \tau_\mathrm{reio}
    renames: tau

  # ============================================================================
  # ACT DR6 CMB-only Calibration Nuisance Parameters
  # Source:
  #   - candl_data/candl_data/ACT_DR6_CMB_only_v0/ACT_DR6_CMB_only.yaml L21-L36
  #   - spt_candl_data/cobaya/SPT3G_D1_KK/configs/likelihoods/cmb/spalitetteete_nosroll2.yaml L35-L47
  #   - Louis et al. (2025, arXiv:2503.14452)
  # ============================================================================
  A_act:
    # Overall temperature calibration prior: N(1.0, 0.003) (ACT_DR6_CMB_only.yaml L34-L36)
    prior: {dist: norm, loc: 1.0, scale: 0.003}
    ref: {dist: norm, loc: 1.0, scale: 0.001}
    proposal: 0.001
    latex: A_\mathrm{ACT}
  P_act:
    # Overall polarization efficiency prior: flat [0.9, 1.1] (spalitetteete_nosroll2.yaml L38-L41)
    prior: {min: 0.9, max: 1.1}
    ref: {dist: norm, loc: 1.0, scale: 0.005}
    proposal: 0.003
    latex: p_\mathrm{ACT}

  # ============================================================================
  # Derived Parameters (matched to corrected_planck2018.yaml)
  # ============================================================================
  H0: {latex: H_0}
  Omega_Lambda: {latex: \Omega_\Lambda}
  Omega_m: {latex: '\Omega_\mathrm{m}'}
  omegamh2:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  omegamh3:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**3'
    latex: \Omega_\mathrm{m} h^3
  sigma8: {latex: \sigma_8}
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8
  s8omegamp25:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  z_reio: {latex: 'z_\mathrm{re}'}
  A:
    derived: 'lambda A_s: 1e9*A_s'
    latex: 10^9 A_\mathrm{s}
  clamp:
    derived: 'lambda A_s, tau_reio: 1e9*A_s*np.exp(-2*tau_reio)'
    latex: 10^9 A_\mathrm{s} e^{-2\tau}
  YHe: {latex: 'Y_\mathrm{P}'}
  age: {latex: '{\rm Age}/\mathrm{Gyr}'}
  rs_drag: {latex: 'r_\mathrm{drag}'}

sampler:
  # Taken directly from spt_candl_data/cobaya/SPT3G_D1_TnE/cobaya_ttteee_lite.yaml L119-L130
  # and Cobaya's cobaya/samplers/mcmc/mcmc.yaml defaults:
  mcmc:
    covmat: ../spt_candl_data/cobaya/SPT3G_D1_TnE/input_ttteee.covmat
    drag: true
    oversample_power: 0.4
    proposal_scale: 1.9
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    learn_proposal: true
    max_tries: 10000

output: chains/corrected_act_dr6/chain
