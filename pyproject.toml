[project]
name = "thesis"
version = "0.1.0"
description = "RWTH Physik Thesis - unified env Mac + Windows/WSL"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "pyyaml",
  "ipython",
  "jupyter",
  "cython",
  "mpi4py",
  "cobaya",
  "getdist",
  "classy",
  "candl-like>=2.2.0",
  "clipy-like>=0.15",
  "spt-candl-data",
  "candl-data",
  "gpjax<=0.18.0",
  "jax<0.6",
]

[dependency-groups]
dev = [
  "ruff",
  "pytest",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
spt-candl-data = { path = "../spt_candl_data", editable = true }
candl-data = { path = "../candl_data", editable = true }
