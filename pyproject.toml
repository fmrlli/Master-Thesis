[project]
name = "thesis"
version = "0.1.0"
description = "RWTH Physik Thesis - unified env Mac + Windows/WSL"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "pyyaml",
  "ipython",
  "jupyter",
  "cython",
  "mpi4py",
  "cobaya",
  "getdist",
  "classy",
]

[dependency-groups]
dev = [
  "ruff",
  "pytest",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
